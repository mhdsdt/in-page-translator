<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In-Page Translator</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <header>
      <img src="icons/48.png" width="46" height="46" alt="">
      <h1>In-Page<br>Translator</h1>
    </header>
    <form id="translation">
      <div class="languages">
        <label for="source">From</label>
        <select id="source" disabled></select>
        <label for="target">To</label>
        <select id="target" disabled></select>
      </div>
      <div class="status">
        <p id="status" role="status" aria-atomic="true">Opening current page…</p>
      </div>
      <button id="action" type="submit" disabled>Translate page <span aria-hidden="true">→</span></button>
    </form>
    <footer>
      <button id="language-packs" type="button">Manage language packs</button>
      <span>Translation runs on this device.</span>
    </footer>
  </main>
</body>
</html>
