name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Verify, Package & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full verification suite
        run: npm run check

      - name: Package deterministic release archive
        run: |
          mkdir -p release
          (cd dist && find . -type f ! -name '.DS_Store' | LC_ALL=C sort | zip -X -q -@ ../release/in-page-translator.zip)
          (cd release && sha256sum in-page-translator.zip > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/in-page-translator.zip release/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/in-page-translator.zip release/SHA256SUMS.txt \
              --title "In-Page Translator $VERSION" \
              --generate-notes
          fi
