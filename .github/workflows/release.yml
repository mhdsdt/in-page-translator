name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as a draft release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Verify, Package & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read package version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package.json version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full verification suite
        run: npm run check

      - name: Package deterministic release archive
        run: |
          mkdir -p release
          (cd dist && find . -type f ! -name '.DS_Store' | LC_ALL=C sort | zip -X -q -@ ../release/in-page-translator.zip)
          (cd release && sha256sum in-page-translator.zip > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/in-page-translator.zip release/SHA256SUMS.txt --clobber
          else
            args=(--target "$GITHUB_SHA" --title "In-Page Translator $VERSION" --generate-notes)
            if [ "$DRAFT" = "true" ]; then
              args+=(--draft)
            fi
            gh release create "$TAG" release/in-page-translator.zip release/SHA256SUMS.txt "${args[@]}"
          fi
